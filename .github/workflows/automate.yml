name: Automated Pipeline

on:
  repository_dispatch:
    types: [automation-hub-trigger]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check for updates
        run: |
          echo "10K-redlines: automation check complete"
          echo "This project requires manual LLM analysis — the hub will notify when new 10-K filings are available."
          echo "To rebuild dashboards locally, run: python build_dashboard.py <company>/analysis.json <company>/index.html"

      - name: Generate run summary
        run: python .github/scripts/summarize_changes.py

      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-summary
          path: run-summary.json
          retention-days: 30
